name: DART Realtime Monitor

on:
  schedule:
    # 5분마다 정기적으로 실행
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        pip install requests

    - name: 스크립트 실행
      env:
        # 이 부분의 문법을 secrets.변수명 형태로 정확히 교정합니다.
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: 중복 방지 히스토리 파일 자동 저장 (Git Commit)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add history.txt || true
        git commit -m "Update public history" || true
        git push || true
