name: DART Realtime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 파일 자동 수정을 위해 쓰기 권한 부여
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        pip install requests

    - name: 스크립트 실행
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: 새 사용자 명단 및 히스토리 자동 저장 (Git Commit)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add history.txt users.txt || true
        git commit -m "Update history and user database" || true
        git push || true
